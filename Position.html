<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Properties</title>

    <style>

        .static{
            position: static;
            border: 2px solid red;
            background-color: pink;
            padding: 10px;
            margin-bottom: 20px;
        }

        .relative{
            position: relative;
            left: 30px;
            border: 2px solid purple;
            background-color: lavender;
            padding: 10px;
            margin-bottom: 20px;
        }

        .parent{
            position: relative;
            height: 200px;
            border: 2px solid brown;
            background-color: beige;
            margin-bottom: 20px;
        }

        .absolute{
            position: absolute;
            top: 50px;
            left: 50px;
            background-color: lightgreen;
            padding: 10px;
        }

        .fixed{
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: skyblue;
            padding: 10px;
        }

        .sticky{
            position: sticky;
            top: 0;
            background-color: gold;
            padding: 10px;
        }

    </style>
</head>

<body>

    <div class="sticky">
        Sticky Position
    </div>

    <h2>CSS Position Properties Example</h2>

    <div class="static">
        Static Position
    </div>

    <div class="relative">
        Relative Position
    </div>

    <div class="parent">

        <div class="absolute">
            Absolute Position
        </div>

    </div>

    <div class="fixed">
        Fixed Position
    </div>

    <p style="height:1000px;">
        Scroll the page to see sticky and fixed position effects.
    </p>

</body>
</html>
