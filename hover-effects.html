<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title>

    <style>

        button{
            background-color: purple;
            color: white;

            padding: 10px 20px;
            border: none;

            font-size: 18px;
        }

        button:hover{
            background-color: orange;
            color: black;

            border-radius: 10px;
        }

    </style>
</head>

<body>

    <button>
        Hover Me
    </button>

</body>
</html>
