<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Properties Example</title>

    <style>

        .container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;

            height: 300px;
            border: 2px solid black;
            background-color: beige;
        }

        .box{
            width: 100px;
            height: 100px;

            background-color: lightpink;
            border: 2px solid red;

            text-align: center;
            line-height: 100px;

            font-size: 25px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h2>Flex Properties Example</h2>

    <div class="container">

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>

    </div>

</body>
</html>
